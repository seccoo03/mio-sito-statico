on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write
  pages: write
  id-token: write

jobs:


  quality-check:
    name: "Job A · Quality Check"
    runs-on: ubuntu-latest

    steps:

      - name: Checkout codice
        uses: actions/checkout@v4


      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"


      - name: Linting HTML con htmlhint
        run: |
          npm install -g htmlhint
          htmlhint "**/*.html"

      - name: Link Checker con Lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: --verbose --no-progress './**/*.html'
          fail: true  

  docker-build:
    name: "Job B · Docker Build & Push"
    runs-on: ubuntu-latest
    needs: quality-check  

    steps:
      - name: Checkout codice
        uses: actions/checkout@v4


      - name: Login a GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

    
      - name: Build e Push immagine Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:latest
            ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:${{ github.sha }}


  deploy-pages:
    name: "Job C · Deploy GitHub Pages"
    runs-on: ubuntu-latest
    needs: docker-build   

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout codice
        uses: actions/checkout@v4

      
      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

     
      - name: Upload artifact Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."   

   
      - name: Deploy su GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4